<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Pilflip Lengkap - Drag & Drop</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: transparent;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        canvas { 
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" width="800" height="600"></canvas>
    <script src="libs.js"></script>
    <script src="builder.js"></script>
    <script src="main.js"></script>
</body>
</html>
